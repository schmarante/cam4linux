# Pushing a tag like v0.4.0 builds dist/cam4linux.pyz and publishes it as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches cam4linux.__version__
        run: |
          version=$(python3 -c 'import cam4linux; print(cam4linux.__version__)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi

      - name: Build
        run: ./build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/cam4linux.pyz \
            --title "cam4linux $GITHUB_REF_NAME" --generate-notes
